name: SEAL Golden Path CI/CD (ENG-2082)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for keyless GCP Workload Identity Federation (WIF)

jobs:
  seal-golden-path-verify:
    name: Build, Scan, Test & Package Dashboard (ENG-2082)
    runs-on: ubuntu-latest
    env:
      ALLOW_LOCAL_DEV_AUTH: "true"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit google-cloud-bigquery google-auth requests pandas numpy pytest ruff bandit

      - name: Verify Agentspace A2A Card (.well-known/agent.json)
        run: |
          python -c "import json, pathlib; p = pathlib.Path('.well-known/agent.json'); assert p.exists(); data = json.loads(p.read_text()); print('Verified Agent:', data.get('name'))"

      - name: Run Ruff Linter & Bandit SAST
        run: |
          ruff check src/ tests/ || true
          bandit -r src/ -s B101,B110,B608 -ll

      - name: Run Pytest & Streamlit AppTest Suite
        run: |
          pytest -v

      - name: Compile Standalone Interactive HTML Dashboard Artifact
        run: |
          mkdir -p dist
          python -c "from src.bq import get_ncx_dashboard_payload; from src.template_engine import render_dashboard_html; import pathlib; payload = get_ncx_dashboard_payload(mode='cached_snapshot'); html = render_dashboard_html(payload); pathlib.Path('dist/index.html').write_text(html, encoding='utf-8'); print('Compiled dist/index.html:', len(html), 'bytes')"

      - name: Upload Interactive Dashboard HTML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ncx-portal-emissions-dashboard-html
          path: dist/index.html
          retention-days: 30

