name: SEAL Golden Path CI/CD (ENG-2082)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write # Required for keyless GCP Workload Identity Federation (WIF)

jobs:
  seal-golden-path-pipeline:
    name: Build, Scan, Test & Deploy to Cloud Run
    uses: transurban/seal-platform-workflows/.github/workflows/streamlit-golden-path.yml@v1
    with:
      app_name: ncx-portal-emissions
      gcp_project_id: tu-data-edw-pr-1
      gcp_region: australia-southeast1
      artifact_registry_repo: seal-apps-docker
      jfrog_pypi_mirror: https://transurban.jfrog.io/artifactory/api/pypi/pypi-remote/simple
      pulumi_stack_dir: infra
      run_ruff: true
      run_bandit: true
      run_gitleaks: true
      run_trivy: true
      run_pytest_apptest: true
      verify_agentspace_card: true
